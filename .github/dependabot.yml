# Keeps reveal.js and any GitHub Actions patched automatically.
# Dependabot opens a pull request when a new version or a security fix lands.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
